name: TEST-SSM

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-1

jobs:
  test-ssm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::749185460978:role/github-actions-ecr-role

      - name: Transfer seed.sql to EC2
        run: |
          SEED_SQL=$(base64 -w 0 DB/seed.sql)

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-0dcac0df79e18f072 \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"echo '$SEED_SQL' | base64 -d > /home/ssm-user/work/DB/seed.sql\"]" \
            --region ${{ env.AWS_REGION }} \
            --query "Command.CommandId" \
            --output text)

          echo "Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id i-0dcac0df79e18f072

      - name: Check seed.sql
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-0dcac0df79e18f072 \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["ls -l /home/ssm-user/work/DB/seed.sql"]' \
            --region ${{ env.AWS_REGION }} \
            --query "Command.CommandId" \
            --output text)

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id i-0dcac0df79e18f072

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id i-0dcac0df79e18f072 \
            --query "StandardOutputContent" \
            --output text